<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光影工作室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">

<div id="app" data-mode="home">
  <header class="bar">
    <button class="brand" id="homeBtn" title="回首頁">光影<span>工作室</span></button>
    <nav class="modes" role="tablist" aria-label="工作模式">
      <button role="tab" data-mode="photo" aria-selected="false">修圖</button>
      <button role="tab" data-mode="collage" aria-selected="false">拼圖</button>
      <button role="tab" data-mode="video" aria-selected="false">剪輯</button>
    </nav>
    <div class="bar-actions" id="barActions" hidden>
      <button id="undoBtn" class="btn ghost" title="復原（Ctrl+Z）">復原</button>
      <button id="redoBtn" class="btn ghost" title="重做（Ctrl+Y）">重做</button>
      <button id="openBtn" class="btn">開啟圖片</button>
      <button id="exportBtn" class="btn primary">匯出</button>
    </div>
  </header>

  <section class="mode" id="home">
    <div class="home-inner">
      <h1>今天想做什麼？</h1>
      <p class="home-lead">修圖、拼圖、剪輯影片都在這裡完成。檔案只在你的裝置上處理，不會上傳。</p>
      <div class="home-cards">
        <button class="home-card" data-go="photo">
          <canvas id="homePhoto" width="480" height="300"></canvas>
          <strong>修圖</strong>
          <span>調色、濾鏡、美顏瘦臉、裁切拉正、文字貼圖、馬賽克、邊框</span>
        </button>
        <button class="home-card" data-go="collage">
          <canvas id="homeCollage" width="480" height="300"></canvas>
          <strong>拼圖</strong>
          <span>最多 9 張照片自動排版，可調比例、間距、圓角，拼完直接送去修圖</span>
        </button>
        <button class="home-card" data-go="video">
          <canvas id="homeVideo" width="480" height="300"></canvas>
          <strong>剪輯</strong>
          <span>修剪、分割、變速、濾鏡、文字、配樂、自動字幕，最高匯出 4K</span>
        </button>
      </div>
      <p class="home-drop">也可以直接把照片或影片拖進這個畫面：一張照片進修圖，多張進拼圖，影片進剪輯。</p>
    </div>
  </section>

  <section class="mode" id="photo" hidden>
    <nav class="tools" id="photoTools" aria-label="修圖工具"></nav>
    <div class="stage">
      <div class="fitbox">
        <div class="canvas-wrap">
          <canvas id="pv"></canvas>
          <div id="cropBox" hidden>
            <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
          </div>
          <div id="brushRing" hidden></div>
        </div>
        <div class="empty" id="photoEmpty" hidden>
          <strong>還沒有圖片</strong>
          <span>開啟一張照片就能開始修圖，也可以直接拖進來或按 Ctrl+V 貼上。</span>
          <button class="btn primary" id="photoEmptyBtn">開啟圖片</button>
        </div>
      </div>
      <div class="stage-foot">
        <span id="photoInfo"></span>
        <button id="compareBtn" class="btn ghost small">按住看原圖</button>
      </div>
    </div>
    <aside class="panel" id="photoPanel"></aside>
  </section>

  <section class="mode" id="collage" hidden>
    <div class="stage">
      <div class="fitbox">
        <div class="canvas-wrap"><canvas id="cv2"></canvas></div>
        <div class="empty" id="collageEmpty" hidden>
          <strong>還沒有圖片</strong>
          <span>加入 2 到 9 張照片就能開始拼圖，也可以直接把照片拖進來。</span>
          <button class="btn primary" id="collageEmptyBtn">加入圖片</button>
        </div>
      </div>
      <div class="stage-foot"><span id="collageInfo"></span></div>
    </div>
    <aside class="panel" id="collagePanel"></aside>
  </section>

  <section class="mode" id="video" hidden>
    <div class="stage">
      <div class="fitbox">
        <div class="canvas-wrap"><canvas id="vc"></canvas></div>
        <div class="empty" id="videoEmpty" hidden>
          <strong>還沒有素材</strong>
          <span>加入影片或圖片就能開始剪輯，也可以直接把檔案拖進來。</span>
          <button class="btn primary" id="videoEmptyBtn">加入影片或圖片</button>
        </div>
      </div>
    </div>
    <aside class="panel" id="videoPanel"></aside>
    <div class="timeline">
      <div class="stt-bar" id="sttBar" hidden>
        <span id="sttText"></span>
        <div class="progress"><div id="sttProgress"></div></div>
        <button id="sttCancel" class="btn small">取消字幕</button>
      </div>
      <div class="tl-tools">
        <button id="playBtn" class="btn primary small">播放</button>
        <span id="timeLabel" class="time">0:00.0 / 0:00.0</span>
        <span class="spacer"></span>
        <button id="splitBtn" class="btn small" title="在播放頭的位置把片段切成兩段">分割</button>
        <button id="dupBtn" class="btn small">複製</button>
        <button id="leftBtn" class="btn small" title="往前移">←</button>
        <button id="rightBtn" class="btn small" title="往後移">→</button>
        <button id="delBtn" class="btn small danger">刪除</button>
        <label class="zoom" for="zoomRange">縮放<input type="range" id="zoomRange" min="10" max="160" value="50"></label>
      </div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-inner" id="tlInner">
          <div class="ruler" id="tlRuler"></div>
          <div class="track t-text" id="tlTexts"></div>
          <div class="track t-clips" id="tlClips"></div>
          <div class="track t-music" id="tlMusic"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="exportOverlay" hidden>
  <div class="export-card">
    <h2>正在匯出影片</h2>
    <p>影片會照實際速度錄一次，長度多久就需要多久。匯出期間請讓這個分頁留在最前面。</p>
    <div class="progress"><div id="exportBar"></div></div>
    <button id="cancelExport" class="btn">取消匯出</button>
  </div>
</div>
<div id="dlg" hidden><div class="export-card" id="dlgCard"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileImgs" accept="image/*" multiple hidden>
<input type="file" id="fileMedia" accept="video/*,image/*,audio/*" multiple hidden>
<input type="file" id="fileAudio" accept="audio/*" hidden>

<script>
  // 每次改版把 VERSION 加一。只有在 GitHub Pages 才加版本參數，避免瀏覽器繼續用舊的程式檔
  (function () {
    var VERSION = '12', bust = /github\.io$/.test(location.hostname) ? '?v=' + VERSION : '';
    if (bust) {
      var css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = 'app.css' + bust;
      document.head.appendChild(css);
    }
    ['core', 'photo', 'collage', 'video', 'stt', 'music', 'main'].forEach(function (name) {
      var s = document.createElement('script');
      s.src = name + '.js' + bust; s.async = false;
      document.body.appendChild(s);
    });
  })();
</script>
